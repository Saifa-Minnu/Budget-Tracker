<!DOCTYPE html>
<html>
<head>
  <title>Sign Up</title>
  <link rel="stylesheet" href="style3.css">
</head>
<body>

<div class="login-container">

  <div class="circles-wrapper">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="login-box">

    <h2>Sign Up</h2>

    <form id="signupForm">

      <div class="input-group">
        <input id="su-user" type="text" placeholder="Username">
      </div>

      <div class="input-group">
        <input id="su-pass" type="password" placeholder="Password">
      </div>

      <button class="sign-in-btn" onclick="signup()">Sign Up</button>

    </form>

    <div class="links">
      <a href="login2.html" id="loginLink">Login</a>
    </div>

  </div>

</div>

<script src="script2.js"></script>

</body>
</html>
